name: Proton Valve xbe nopackage Arch Linux CI

on:
  schedule:
    - cron:  '45 8,20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          pacman -Syu --noconfirm base-devel sudo lib32-jack2
          useradd user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown user -R ..
          chown user -R /tmp
          export CARGO_HOME="$PWD"
          cd proton-tkg
          sed -i 's/_skip_uninstaller="false"/_skip_uninstaller="true"/' proton-tkg.cfg
          sed -i 's/_no_autoinstall="false"/_no_autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_build_gstreamer="false"/_build_gstreamer="true"/' proton-tkg.cfg
          sed -i 's/_lib32_gstreamer="false"/_lib32_gstreamer="true"/' proton-tkg.cfg
          sed -i 's/_wayland_driver="false"/_wayland_driver="true"/' proton-tkg.cfg
          sed -i 's/_no_container="false"/_no_container="true"/' proton-tkg.sh
          touch tarplz
          yes|./proton-tkg.sh
      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-build
          path: proton-tkg/built/*.tar
